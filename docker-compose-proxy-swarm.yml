services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    configs:
      - source: nginx_proxy_conf
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - laravel_proxy_certs:/etc/nginx/certs:ro
      - laravel_proxy_webroot:/var/www/certbot:ro
    networks:
      - laravel_proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first

networks:
  laravel_proxy:
    driver: overlay
    attachable: true
    name: laravel_proxy

volumes:
  laravel_proxy_certs:
    name: laravel_proxy_certs
  laravel_proxy_webroot:
    name: laravel_proxy_webroot

configs:
  nginx_proxy_conf:
    file: ./.docker/nginx/proxy.conf

; ============================================================
; Supervisord — Development
; ============================================================
[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=debug

; Laravel Octane (FrankenPHP) — single worker, no request cap for easy debugging
[program:octane]
command=php /var/www/html/artisan octane:start --server=frankenphp --host=0.0.0.0 --port=80 --workers=8 --max-requests=500 --admin-port=8001 --watch
directory=/var/www/html
user=root
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Laravel Queue Worker
[program:queue]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=1 --verbose
directory=/var/www/html
user=root
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

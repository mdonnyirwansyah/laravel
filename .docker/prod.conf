; ============================================================
; Supervisord — Production
; ============================================================
[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

; Laravel Octane (FrankenPHP)
; 8 workers — optimized for I/O-bound workloads; provides ~800 RPS headroom
[program:octane]
command=php /var/www/html/artisan octane:start --server=frankenphp --host=0.0.0.0 --port=80 --admin-port=8001 --workers=8 --max-requests=500 --log-level=info
directory=/var/www/html
user=root
autostart=true
autorestart=true
startretries=3
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Laravel Queue Worker — requires QUEUE_CONNECTION=redis
; [program:queue]
; command=php /var/www/html/artisan queue:work redis --sleep=1 --tries=2 --max-time=3600 --memory=128
; directory=/var/www/html
; user=root
; autostart=true
; autorestart=true
; startretries=3
; stopwaitsecs=60
; numprocs=2
; process_name=%(program_name)s_%(process_num)02d
; stdout_logfile=/dev/stdout
; stdout_logfile_maxbytes=0
; stderr_logfile=/dev/stderr
; stderr_logfile_maxbytes=0

; Laravel Scheduler — executes scheduled tasks every 60 seconds
; [program:scheduler]
; command=sh -c "while true; do php /var/www/html/artisan schedule:run --no-interaction; sleep 60; done"
; directory=/var/www/html
; user=root
; autostart=true
; autorestart=true
; stdout_logfile=/dev/stdout
; stdout_logfile_maxbytes=0
; stderr_logfile=/dev/stderr
; stderr_logfile_maxbytes=0

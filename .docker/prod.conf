; ============================================================
; Supervisord — Production
; ============================================================
[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

; Laravel Octane (FrankenPHP)
; workers=8: I/O-heavy workload (upstream API calls) benefits from more workers
; than CPU cores. With queue-backed cache refresh, each request holds a worker
; for only ~10ms instead of ~700ms, so 8 workers handles ~800 RPS headroom.
[program:octane]
command=php /var/www/html/artisan octane:start --server=frankenphp --host=0.0.0.0 --port=80 --admin-port=8001 --workers=8 --max-requests=500 --log-level=info
directory=/var/www/html
user=root
autostart=true
autorestart=true
startretries=3
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Laravel Queue Worker — processes background jobs (cache refresh, etc.)
; Requires QUEUE_CONNECTION=redis in .env
; [program:queue]
; command=php /var/www/html/artisan queue:work redis --sleep=1 --tries=2 --max-time=3600 --memory=128
; directory=/var/www/html
; user=root
; autostart=true
; autorestart=true
; startretries=3
; stopwaitsecs=60
; numprocs=2
; process_name=%(program_name)s_%(process_num)02d
; stdout_logfile=/dev/stdout
; stdout_logfile_maxbytes=0
; stderr_logfile=/dev/stderr
; stderr_logfile_maxbytes=0

; Laravel Scheduler (runs every minute)
; [program:scheduler]
; command=sh -c "while true; do php /var/www/html/artisan schedule:run --no-interaction; sleep 60; done"
; directory=/var/www/html
; user=root
; autostart=true
; autorestart=true
; stdout_logfile=/dev/stdout
; stdout_logfile_maxbytes=0
; stderr_logfile=/dev/stderr
; stderr_logfile_maxbytes=0

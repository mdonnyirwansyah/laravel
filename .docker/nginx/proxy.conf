# Docker embedded DNS — lazy resolve so nginx doesn't crash if `app` isn't ready yet
resolver 127.0.0.11 valid=10s ipv6=off;

# ─── DDoS / abuse mitigation (L7) ──────────────────────────────────────
# Rate-limit zones (shared memory keyed by client IP)
limit_req_zone  $binary_remote_addr zone=req_global:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=req_login:10m  rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# (Slowloris timeouts are set per-server below — keepalive_timeout is already
#  defined in the base nginx.conf and would conflict if redeclared here.)
# ───────────────────────────────────────────────────────────────────────

# Redirect HTTP → HTTPS, kecuali ACME challenge & healthcheck
server {
    listen 80;
    server_name _;

    # Slowloris / slow-POST mitigation
    client_body_timeout         10s;
    client_header_timeout       10s;
    send_timeout                10s;
    keepalive_timeout           15s;
    large_client_header_buffers 4 8k;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Self-signed cert (default) — diganti certbot otomatis kalau pakai Let's Encrypt
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Slowloris / slow-POST mitigation
    client_body_timeout         10s;
    client_header_timeout       10s;
    send_timeout                10s;
    keepalive_timeout           15s;
    large_client_header_buffers 4 8k;

    client_max_body_size 10m;

    # Block disallowed HTTP methods
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # Block known scanner/abuse User-Agents (drop without response)
    if ($http_user_agent ~* (nikto|sqlmap|nmap|masscan|zgrab|fuzzer|wpscan)) {
        return 444;
    }
    if ($http_user_agent = "") {
        return 444;
    }

    # Global per-IP throttle
    limit_req  zone=req_global burst=60 nodelay;
    limit_conn conn_per_ip 20;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Strict throttle on auth endpoints (5 req/min per IP)
    location ~ ^/(login|register|password|api/auth) {
        limit_req zone=req_login burst=3 nodelay;
        set $upstream "app:80";
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
    }

    location / {
        set $upstream "app:80";
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_read_timeout 60s;
    }
}

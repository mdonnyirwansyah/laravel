; ============================================================
; Custom PHP Configuration for Laravel
; ============================================================
[PHP]
; Limits
memory_limit=256M
max_execution_time=60
max_input_time=60

; File uploads
upload_max_filesize=50M
post_max_size=50M

; Errors — off in production, override in dev via APP_ENV
display_errors=Off
log_errors=On
error_log=/dev/stderr

; Date
date.timezone=UTC

; Session
session.gc_maxlifetime=3600

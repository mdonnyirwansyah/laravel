; ============================================================
; Custom PHP Configuration for Laravel
; ============================================================
[PHP]
; Resource limits
memory_limit=256M
max_execution_time=60
max_input_time=60

; File uploads
upload_max_filesize=50M
post_max_size=50M

; Error handling (display disabled for production; override via APP_ENV)
display_errors=Off
log_errors=On
error_log=/dev/stderr

; Timezone
date.timezone=UTC

; Session management
session.gc_maxlifetime=3600

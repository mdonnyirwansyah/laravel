# ─── Upstream keepalive pool for FrankenPHP ──────────────────────────────
upstream laravel_app {
    server laravel_app_1:80;
    keepalive 32;
}

# ─── Custom access log with request timing and upstream metrics ────────
log_format main_timed
  '$remote_addr - $remote_user [$time_local] '
  '"$request" $status $body_bytes_sent '
  'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time" '
  'upstream=$upstream_addr '
  '"$http_referer" "$http_user_agent"';

access_log /var/log/nginx/access.log main_timed;
# ───────────────────────────────────────────────────────────────────────

# ─── Layer 7 rate limiting ─────────────────────────────────────────────
limit_req_zone  $binary_remote_addr zone=req_global:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=req_login:10m  rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

limit_req_status  429;
limit_conn_status 429;
# ───────────────────────────────────────────────────────────────────────

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _ localhost 127.0.0.1; # Accept local IPs and catch-all

    client_body_timeout         10s;
    client_header_timeout       10s;
    send_timeout                10s;
    keepalive_timeout           15s;
    large_client_header_buffers 4 8k;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name _ localhost 127.0.0.1; # Accept local IPs and catch-all

    # Default self-signed certificate — replace with Let's Encrypt via Certbot as needed
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_body_timeout         10s;
    client_header_timeout       10s;
    send_timeout                10s;
    keepalive_timeout           15s;
    large_client_header_buffers 4 8k;

    client_max_body_size 10m;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    if ($http_user_agent ~* (nikto|sqlmap|nmap|masscan|zgrab|fuzzer|wpscan)) {
        return 444;
    }
    if ($http_user_agent = "") {
        return 444;
    }

    limit_req  zone=req_global burst=60 nodelay;
    limit_conn conn_per_ip 20;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Authentication endpoints — strict rate limit (5 req/min per IP)
    location ~ ^/(login|register|password|api/auth) {
        limit_req zone=req_login burst=3 nodelay;

        proxy_pass http://laravel_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_socket_keepalive on;

        # Forward original Host header to ensure correct upstream routing
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_read_timeout 60s;
    }

    # Default location — proxy all remaining requests
    location / {
        proxy_pass http://laravel_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_socket_keepalive on;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_read_timeout 60s;
    }
}

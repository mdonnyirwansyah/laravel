# ── Ingress AKTIF: akses via IP lokal (HTTPS self-signed) ─
# Tidak ada `host:` → match semua hostname, termasuk akses
# langsung ke IP node. Cert-manager auto-issue cert
# self-signed lewat annotation di bawah.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: laravel
  namespace: laravel
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - laravel.local
      secretName: laravel-tls
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80
---

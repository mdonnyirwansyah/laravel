# ── SelfSigned issuer untuk akses lewat IP lokal ─────────
# Cert-manager akan generate cert self-signed tiap kali
# Ingress butuh. Browser akan warning, klik "Proceed".
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---

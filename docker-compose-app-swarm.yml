services:
  app:
    image: ghcr.io/mdonnyirwansyah/laravel:latest-arm64
    networks:
      - laravel_data
      - laravel_proxy
    secrets:
      - laravel_app_key
      - laravel_db_password
    environment:
      - APP_KEY_FILE=/run/secrets/laravel_app_key
      - APP_DEBUG=false
      - LOG_CHANNEL=stderr
      - LOG_LEVEL=info
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_DATABASE=laravel
      - DB_PASSWORD_FILE=/run/secrets/laravel_db_password
      - REDIS_HOST=redis
      - TRUSTED_PROXIES=*
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

networks:
  laravel_data:
    external: true
  laravel_proxy:
    external: true

secrets:
  laravel_app_key:
    external: true
  laravel_db_password:
    external: true
